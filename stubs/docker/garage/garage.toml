metadata_dir = "/meta"
data_dir = "/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
# Substituted at build time by the Dockerfile's "config" stage, from the GARAGE_RPC_PUBLIC_ADDR
# build arg GarageService sets to this instance's compose service name ("garage:3901", or
# "garage-<name>:3901" for a named instance).
rpc_public_addr = "__GARAGE_RPC_PUBLIC_ADDR__"
# No rpc_secret here: GarageService supplies it through GARAGE_RPC_SECRET, which overrides this
# file, so each project has its own secret.

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
