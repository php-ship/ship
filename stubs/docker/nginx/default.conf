server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Don't advertise the nginx version in the Server header.
    server_tokens off;

    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Exact match on the front controller only; `location ~ \.php$` would pass any path ending in
    # .php to PHP-FPM.
    location = /index.php {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Any other .php path returns 404 instead of being served as a static file (raw source) by
    # "location /". The exact match above outranks this regex for /index.php.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
