server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Doesn't advertise the exact nginx version in the Server: response header -- the version
    # itself is a smaller, specific CVE search target than "nginx" alone.
    server_tokens off;

    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Exact match on the front controller only -- not `location ~ \.php$`, which would pass *any*
    # request path ending in .php to PHP-FPM, existing file or not.
    location = /index.php {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Without this, any *other* .php file under public/ (a second entry script some non-Laravel
    # app has, say) falls through to "location /"'s try_files, which finds it as a literal file
    # and serves it statically -- raw PHP source, not executed, as a plain-text download. nginx's
    # exact match above always wins over this regex for /index.php itself (exact match outranks
    # regex in nginx's own matching order), so this only ever catches every other .php path,
    # turning what try_files would otherwise serve as a download into a plain 404 instead.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
