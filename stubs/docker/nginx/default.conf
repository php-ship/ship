server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Exact match on the front controller only -- not `location ~ \.php$`, which would pass *any*
    # request path ending in .php to PHP-FPM, existing file or not. If a .php file ever ends up
    # under public/ some other way, this location block never sees it; "location /" above's
    # try_files finds it as a literal file and nginx serves it statically (raw source, not
    # executed) instead of running it.
    location = /index.php {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
