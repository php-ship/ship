opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Matches ship/nginx/default.conf's own client_max_body_size -- nginx happily forwards a request
; this large to php-fpm, which then silently rejects it at PHP's own (much smaller stock) default
; instead, emptying $_FILES/$_POST with nothing visible to the end user short of a PHP error log.
upload_max_filesize=100M
post_max_size=100M

; Doesn't advertise the exact PHP version in the X-Powered-By response header -- the version
; itself is a smaller, specific CVE search target than "PHP" alone.
expose_php=Off

; Off by default: Xdebug is installed in every dev image, but a loaded-and-active Xdebug slows
; every request (develop mode in particular) and is documented as unsafe inside Swoole coroutines.
; Turn it on per project with XDEBUG_MODE in .env (e.g. XDEBUG_MODE=debug, or develop,debug) --
; Xdebug's own env var overrides this setting, so no rebuild or ini edit is needed.
xdebug.mode=off
xdebug.client_host=host.docker.internal
xdebug.start_with_request=trigger

display_errors=On
error_reporting=E_ALL
