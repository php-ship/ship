opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Off by default: Xdebug is installed in every dev image, but a loaded-and-active Xdebug slows
; every request (develop mode in particular) and is documented as unsafe inside Swoole coroutines.
; Turn it on per project with XDEBUG_MODE in .env (e.g. XDEBUG_MODE=debug, or develop,debug) --
; Xdebug's own env var overrides this setting, so no rebuild or ini edit is needed.
xdebug.mode=off
xdebug.client_host=host.docker.internal
xdebug.start_with_request=trigger

display_errors=On
error_reporting=E_ALL
