opcache.enable=1
opcache.validate_timestamps=0
opcache.jit=tracing
opcache.jit_buffer_size=64M

; Matches ship/nginx/default.conf's own client_max_body_size -- nginx happily forwards a request
; this large to php-fpm, which then silently rejects it at PHP's own (much smaller stock) default
; instead, emptying $_FILES/$_POST with nothing visible to the end user short of a PHP error log.
upload_max_filesize=100M
post_max_size=100M

; Doesn't advertise the exact PHP version in the X-Powered-By response header -- the version
; itself is a smaller, specific CVE search target than "PHP" alone.
expose_php=Off

; Session upload progress is on by default and runs during request startup, without any
; session_start(); it was the confirmed path to CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp). PHP's
; advisory recommends keeping it off even on patched releases when nothing uses it, and nothing in
; a Laravel or Symfony app does. It must be set here, not via ini_set() or .user.ini.
session.upload_progress.enabled=Off

; PHP 8.5's fatal-error backtraces were the confirmed producer behind CVE-2026-109619's remote code
; execution. Unknown on PHP < 8.5, where this line is ignored.
fatal_error_backtraces=Off

display_errors=Off
error_reporting=E_ALL & ~E_DEPRECATED
