name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the checkout and runs tests/builds.
permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs-check

  docker-build:
    name: Docker build (dev + prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install ship's own dependencies
        run: composer install --prefer-dist --no-progress

      - name: Create a fixture Laravel app
        run: composer create-project laravel/laravel /tmp/ci-fixture --prefer-dist --no-interaction

      # bin/ship is invoked directly, so the fixture app needs no Composer dependency on this
      # package: a path repository couldn't resolve inside the Docker build context of a
      # production build.
      - name: ship init (MySQL + Redis)
        working-directory: /tmp/ci-fixture
        run: |
          printf 'MySQL\nRedis\nNone\nNone\nNone\nNone\nNone\nNone\nNone\n8.4\n' \
            | php "$GITHUB_WORKSPACE/bin/ship" init

      - name: Point .env at the ship-provisioned services
        working-directory: /tmp/ci-fixture
        run: |
          php -r '
          $path = ".env";
          $content = file_get_contents($path);
          $replacements = [
              "DB_CONNECTION" => "mysql",
              "DB_HOST" => "mysql",
              "DB_PORT" => "3306",
              "DB_DATABASE" => "ship",
              "DB_USERNAME" => "ship",
              "DB_PASSWORD" => "ship",
              "DB_ROOT_PASSWORD" => "ship-root",
              "CACHE_STORE" => "redis",
              "REDIS_HOST" => "redis",
          ];
          foreach ($replacements as $key => $value) {
              $pattern = "/^{$key}=.*$/m";
              $content = preg_match($pattern, $content)
                  ? preg_replace($pattern, "{$key}={$value}", $content)
                  : $content . "\n{$key}={$value}\n";
          }
          file_put_contents($path, $content);
          '

      - name: ship up (dev) and verify the stack is actually usable
        working-directory: /tmp/ci-fixture
        run: |
          php "$GITHUB_WORKSPACE/bin/ship" up
          php "$GITHUB_WORKSPACE/bin/ship" exec app php artisan migrate --force
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          test "$code" = "200"

      # Shows what the containers were doing; a bare curl failure doesn't say why.
      - name: Dump dev stack state on failure
        if: failure()
        working-directory: /tmp/ci-fixture
        run: |
          docker compose -f ship/docker-compose.generated.yml --project-directory . ps
          docker compose -f ship/docker-compose.generated.yml --project-directory . logs

      - name: ship db reaches the real MySQL container
        working-directory: /tmp/ci-fixture
        run: |
          out=$(php "$GITHUB_WORKSPACE/bin/ship" db <<< "SELECT 'ci-db-ok' AS result;")
          echo "$out" | grep -q 'ci-db-ok'

      - name: Tear down dev stack
        if: always()
        working-directory: /tmp/ci-fixture
        run: docker compose -f ship/docker-compose.generated.yml --project-directory . down -v

      # `--prod` is not an option of `ship up`; it must be rejected rather than ignored.
      - name: ship up --prod is rejected, not silently ignored
        working-directory: /tmp/ci-fixture
        run: |
          ! php "$GITHUB_WORKSPACE/bin/ship" up --prod

      - name: ship release fails cleanly with no --tag in a non-interactive run
        working-directory: /tmp/ci-fixture
        run: |
          ! php "$GITHUB_WORKSPACE/bin/ship" release

      - name: Add deployCommands and a .env.production for the release
        working-directory: /tmp/ci-fixture
        run: |
          php -r '
          $config = json_decode(file_get_contents("ship.json"), true);
          $config["deployCommands"] = ["php artisan migrate --force"];
          $config["publishPorts"] = true;
          file_put_contents("ship.json", json_encode($config, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '
          cp .env .env.production

      - name: ship build builds every project-owned production image
        working-directory: /tmp/ci-fixture
        run: php "$GITHUB_WORKSPACE/bin/ship" build

      - name: ship release --tag produces the portable release artifact
        working-directory: /tmp/ci-fixture
        run: php "$GITHUB_WORKSPACE/bin/ship" release --tag ci-test

      # Structural checks on the artifact, which is the contract a deploy consumes.
      - name: The release artifact has the right shape and no build context left in it
        working-directory: /tmp/ci-fixture
        run: |
          test -f dist/ship/ci-test/docker-compose.yml
          test -f dist/ship/ci-test/.env
          test -f dist/ship/ci-test/release.json
          test -f dist/ship/ci-test/images/app.tar
          test -f dist/ship/ci-test/images/webserver.tar
          test -f dist/ship/ci-test/deploy-commands.sh
          ! grep -q 'build:' dist/ship/ci-test/docker-compose.yml
          php -r '
          $images = json_decode(file_get_contents("dist/ship/ci-test/release.json"), true)["images"];
          exit(count($images) === 2 ? 0 : 1);
          '

      # Load and boot it with nothing but Docker: no source, no Dockerfile, no build context.
      - name: Load the release images and boot the stack from the artifact alone
        working-directory: /tmp/ci-fixture/dist/ship/ci-test
        run: |
          docker load -i images/app.tar
          docker load -i images/webserver.tar
          docker compose --project-directory . up -d --wait mysql redis
          ./deploy-commands.sh
          docker compose --project-directory . up -d
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          test "$code" = "200"

      - name: Dump release stack state on failure
        if: failure()
        working-directory: /tmp/ci-fixture/dist/ship/ci-test
        run: |
          docker compose --project-directory . ps
          docker compose --project-directory . logs

      - name: Tear down the release stack
        if: always()
        working-directory: /tmp/ci-fixture/dist/ship/ci-test
        run: docker compose --project-directory . down -v --rmi local

      # A separate fixture for the Octane/Swoole runtime, whose PECL extension (and its build
      # dependencies) the default fpm fixture never compiles.
      - name: Create a fixture Laravel app for the Swoole runtime
        run: composer create-project laravel/laravel /tmp/ci-fixture-swoole --prefer-dist --no-interaction

      # ship provides the swoole extension and OCTANE_SERVER, but not the laravel/octane package.
      - name: Install Laravel Octane (documented prerequisite for the Octane runtime)
        working-directory: /tmp/ci-fixture-swoole
        run: |
          composer require laravel/octane --no-interaction
          php artisan octane:install --server=swoole --no-interaction

      # "1" picks the runtime group's first option (Octane/Swoole) by index; its label contains
      # an em dash.
      - name: ship init (MySQL + Redis + Octane/Swoole)
        working-directory: /tmp/ci-fixture-swoole
        run: |
          printf 'MySQL\nRedis\n1\nNone\nNone\nNone\nNone\nNone\nNone\n8.4\n' \
            | php "$GITHUB_WORKSPACE/bin/ship" init

      - name: Point .env at the ship-provisioned services (Swoole fixture)
        working-directory: /tmp/ci-fixture-swoole
        run: |
          php -r '
          $path = ".env";
          $content = file_get_contents($path);
          $replacements = [
              "DB_CONNECTION" => "mysql",
              "DB_HOST" => "mysql",
              "DB_PORT" => "3306",
              "DB_DATABASE" => "ship",
              "DB_USERNAME" => "ship",
              "DB_PASSWORD" => "ship",
              "DB_ROOT_PASSWORD" => "ship-root",
              "CACHE_STORE" => "redis",
              "REDIS_HOST" => "redis",
          ];
          foreach ($replacements as $key => $value) {
              $pattern = "/^{$key}=.*$/m";
              $content = preg_match($pattern, $content)
                  ? preg_replace($pattern, "{$key}={$value}", $content)
                  : $content . "\n{$key}={$value}\n";
          }
          file_put_contents($path, $content);
          '

      # Port 8000, not 80: with an Octane runtime there is no nginx, and "app" publishes
      # ${APP_PORT:-8000}.
      - name: ship up builds and boots the Swoole runtime for real
        working-directory: /tmp/ci-fixture-swoole
        run: |
          php "$GITHUB_WORKSPACE/bin/ship" up
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          test "$code" = "200"

      - name: Dump Swoole stack state on failure
        if: failure()
        working-directory: /tmp/ci-fixture-swoole
        run: |
          docker compose -f ship/docker-compose.generated.yml --project-directory . ps
          docker compose -f ship/docker-compose.generated.yml --project-directory . logs

      - name: Tear down Swoole stack
        if: always()
        working-directory: /tmp/ci-fixture-swoole
        run: docker compose -f ship/docker-compose.generated.yml --project-directory . down -v --rmi local

      # A dev-only fixture for SHIP_MUTAGEN: checks that a real sync session moves files in both
      # directions and that `ship down` tears it down.
      - name: Install Mutagen
        run: |
          MUTAGEN_VERSION=v0.18.1
          TARBALL="mutagen_linux_amd64_${MUTAGEN_VERSION}.tar.gz"
          curl -sL -o "/tmp/${TARBALL}" "https://github.com/mutagen-io/mutagen/releases/download/${MUTAGEN_VERSION}/${TARBALL}"
          # Verified against the checksums the release itself publishes.
          curl -sL -o /tmp/SHA256SUMS "https://github.com/mutagen-io/mutagen/releases/download/${MUTAGEN_VERSION}/SHA256SUMS"
          (cd /tmp && grep "${TARBALL}" SHA256SUMS | sha256sum -c -)
          mkdir -p "$HOME/.local/mutagen"
          # Mutagen looks for mutagen-agents.tar.gz next to its binary.
          tar -xzf "/tmp/${TARBALL}" -C "$HOME/.local/mutagen"
          echo "$HOME/.local/mutagen" >> "$GITHUB_PATH"

      - name: Create a fixture Laravel app for Mutagen sync
        run: composer create-project laravel/laravel /tmp/ci-fixture-mutagen --prefer-dist --no-interaction

      - name: ship init (MySQL + Redis, default runtime)
        working-directory: /tmp/ci-fixture-mutagen
        run: |
          printf 'MySQL\nRedis\nNone\nNone\nNone\nNone\nNone\nNone\nNone\n8.4\n' \
            | php "$GITHUB_WORKSPACE/bin/ship" init

      - name: Point .env at the ship-provisioned services (Mutagen fixture)
        working-directory: /tmp/ci-fixture-mutagen
        run: |
          php -r '
          $path = ".env";
          $content = file_get_contents($path);
          $replacements = [
              "DB_CONNECTION" => "mysql",
              "DB_HOST" => "mysql",
              "DB_PORT" => "3306",
              "DB_DATABASE" => "ship",
              "DB_USERNAME" => "ship",
              "DB_PASSWORD" => "ship",
              "DB_ROOT_PASSWORD" => "ship-root",
              "CACHE_STORE" => "redis",
              "REDIS_HOST" => "redis",
          ];
          foreach ($replacements as $key => $value) {
              $pattern = "/^{$key}=.*$/m";
              $content = preg_match($pattern, $content)
                  ? preg_replace($pattern, "{$key}={$value}", $content)
                  : $content . "\n{$key}={$value}\n";
          }
          file_put_contents($path, $content);
          '

      - name: ship up with SHIP_MUTAGEN=1 builds, boots, and syncs for real
        working-directory: /tmp/ci-fixture-mutagen
        env:
          SHIP_MUTAGEN: '1'
        run: |
          php "$GITHUB_WORKSPACE/bin/ship" up
          php "$GITHUB_WORKSPACE/bin/ship" exec app php artisan migrate --force
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          test "$code" = "200"

      # A file created on the host must land in the container, and vice versa.
      - name: Mutagen actually syncs files in both directions
        working-directory: /tmp/ci-fixture-mutagen
        run: |
          echo "from host" > mutagen-ci-check-host.txt
          for i in $(seq 1 10); do
            php "$GITHUB_WORKSPACE/bin/ship" exec app cat mutagen-ci-check-host.txt 2>/dev/null | grep -q "from host" && break
            sleep 1
          done
          php "$GITHUB_WORKSPACE/bin/ship" exec app cat mutagen-ci-check-host.txt | grep -q "from host"

          php "$GITHUB_WORKSPACE/bin/ship" exec app sh -c "echo 'from container' > mutagen-ci-check-container.txt"
          for i in $(seq 1 10); do
            [ -f mutagen-ci-check-container.txt ] && grep -q "from container" mutagen-ci-check-container.txt && break
            sleep 1
          done
          grep -q "from container" mutagen-ci-check-container.txt

      - name: Dump Mutagen stack state on failure
        if: failure()
        working-directory: /tmp/ci-fixture-mutagen
        run: |
          docker compose -f ship/docker-compose.generated.yml --project-directory . ps
          docker compose -f ship/docker-compose.generated.yml --project-directory . logs
          mutagen sync list

      - name: ship down tears down the Mutagen sync session too
        working-directory: /tmp/ci-fixture-mutagen
        env:
          SHIP_MUTAGEN: '1'
        run: |
          php "$GITHUB_WORKSPACE/bin/ship" down --volumes
          sessions=$(mutagen sync list --template='{{len .}}')
          test "$sessions" = "0"
