name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs-check

  docker-build:
    name: Docker build (dev + prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install ship's own dependencies
        run: composer install --prefer-dist --no-progress

      - name: Create a fixture Laravel app
        run: composer create-project laravel/laravel /tmp/ci-fixture --prefer-dist --no-interaction

      # Invoking bin/ship directly (not through a Composer require) means the fixture app needs
      # no dependency on this package at all -- $projectRoot is just getcwd(), see bin/ship. That
      # sidesteps a real limitation: a Composer path repository pointing at this checkout can't
      # resolve inside an isolated Docker build context, so testing the actual `ship up --prod`
      # build (not just dev) needs the fixture to have no such dependency in the first place.
      - name: ship init (MySQL + Redis)
        working-directory: /tmp/ci-fixture
        run: |
          printf 'MySQL\nRedis\nNone\nNone\nNone\nNone\nNone\nNone\nNone\n8.4\n' \
            | php "$GITHUB_WORKSPACE/bin/ship" init

      - name: Point .env at the ship-provisioned services
        working-directory: /tmp/ci-fixture
        run: |
          php -r '
          $path = ".env";
          $content = file_get_contents($path);
          $replacements = [
              "DB_CONNECTION" => "mysql",
              "DB_HOST" => "mysql",
              "DB_PORT" => "3306",
              "DB_DATABASE" => "ship",
              "DB_USERNAME" => "ship",
              "DB_PASSWORD" => "ship",
              "CACHE_STORE" => "redis",
              "REDIS_HOST" => "redis",
          ];
          foreach ($replacements as $key => $value) {
              $pattern = "/^{$key}=.*$/m";
              $content = preg_match($pattern, $content)
                  ? preg_replace($pattern, "{$key}={$value}", $content)
                  : $content . "\n{$key}={$value}\n";
          }
          file_put_contents($path, $content);
          '

      - name: ship up (dev) and verify the stack is actually usable
        working-directory: /tmp/ci-fixture
        run: |
          php "$GITHUB_WORKSPACE/bin/ship" up
          php "$GITHUB_WORKSPACE/bin/ship" exec app php artisan migrate --force
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          test "$code" = "200"

      # Only ever runs on a failure of the step above -- prints what the containers were actually
      # doing (compose's own status column, plus every service's stdout/stderr) since a bare
      # curl failure alone doesn't say why the app wasn't reachable.
      - name: Dump dev stack state on failure
        if: failure()
        working-directory: /tmp/ci-fixture
        run: |
          docker compose -f ship/docker-compose.generated.yml --project-directory . ps
          docker compose -f ship/docker-compose.generated.yml --project-directory . logs

      - name: ship db reaches the real MySQL container
        working-directory: /tmp/ci-fixture
        run: |
          out=$(php "$GITHUB_WORKSPACE/bin/ship" db <<< "SELECT 'ci-db-ok' AS result;")
          echo "$out" | grep -q 'ci-db-ok'

      - name: Tear down dev stack
        if: always()
        working-directory: /tmp/ci-fixture
        run: docker compose -f ship/docker-compose.generated.yml --project-directory . down -v

      - name: ship up --prod builds and boots for real
        working-directory: /tmp/ci-fixture
        run: |
          php "$GITHUB_WORKSPACE/bin/ship" up --prod
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          test "$code" = "200"
          # artisan optimize runs at container boot -- see EntrypointScriptBuilder -- so the
          # cached bootstrap files existing confirms it actually ran, not just that PHP started.
          php "$GITHUB_WORKSPACE/bin/ship" exec app test -f bootstrap/cache/config.php

      - name: Dump prod stack state on failure
        if: failure()
        working-directory: /tmp/ci-fixture
        run: |
          docker compose -f ship/docker-compose.generated.yml --project-directory . ps
          docker compose -f ship/docker-compose.generated.yml --project-directory . logs

      - name: Tear down prod stack
        if: always()
        working-directory: /tmp/ci-fixture
        run: docker compose -f ship/docker-compose.generated.yml --project-directory . down -v --rmi local

      # A separate fixture (not a reuse of the one above) specifically for the Octane/Swoole
      # runtime: it needs its own PECL extension compiled at image build time (see
      # stubs/docker/php/Dockerfile's swoole build step), which the default fpm runtime the rest
      # of this job covers never exercises at all -- exactly how a missing build dependency there
      # (brotli-dev, needed by Swoole's own configure script) once shipped past a fully green CI.
      - name: Create a fixture Laravel app for the Swoole runtime
        run: composer create-project laravel/laravel /tmp/ci-fixture-swoole --prefer-dist --no-interaction

      # Documented in README's services table as a manual prerequisite -- ship provides the
      # swoole PHP extension and OCTANE_SERVER, but not the laravel/octane package itself or its
      # published config, exactly like a real project adopting Octane would need to do themselves.
      - name: Install Laravel Octane (documented prerequisite for the Octane runtime)
        working-directory: /tmp/ci-fixture-swoole
        run: |
          composer require laravel/octane --no-interaction
          php artisan octane:install --server=swoole --no-interaction

      # "1" picks the runtime group's first non-None option (Octane/Swoole) by index rather than
      # its label text, which contains an em dash ("Octane (Swoole) — default") not worth the risk
      # of mismatching over a plain-ASCII shell pipe.
      - name: ship init (MySQL + Redis + Octane/Swoole)
        working-directory: /tmp/ci-fixture-swoole
        run: |
          printf 'MySQL\nRedis\n1\nNone\nNone\nNone\nNone\nNone\nNone\n8.4\n' \
            | php "$GITHUB_WORKSPACE/bin/ship" init

      - name: Point .env at the ship-provisioned services (Swoole fixture)
        working-directory: /tmp/ci-fixture-swoole
        run: |
          php -r '
          $path = ".env";
          $content = file_get_contents($path);
          $replacements = [
              "DB_CONNECTION" => "mysql",
              "DB_HOST" => "mysql",
              "DB_PORT" => "3306",
              "DB_DATABASE" => "ship",
              "DB_USERNAME" => "ship",
              "DB_PASSWORD" => "ship",
              "CACHE_STORE" => "redis",
              "REDIS_HOST" => "redis",
          ];
          foreach ($replacements as $key => $value) {
              $pattern = "/^{$key}=.*$/m";
              $content = preg_match($pattern, $content)
                  ? preg_replace($pattern, "{$key}={$value}", $content)
                  : $content . "\n{$key}={$value}\n";
          }
          file_put_contents($path, $content);
          '

      # Port 8000, not 80 -- OctaneSwooleService::removes() drops "webserver" entirely and
      # OctaneSwooleService::composeFragment() has "app" itself publish ${APP_PORT:-8000}:8000, so
      # there's no nginx in front of it here the way the default fpm fixture above has.
      - name: ship up builds and boots the Swoole runtime for real
        working-directory: /tmp/ci-fixture-swoole
        run: |
          php "$GITHUB_WORKSPACE/bin/ship" up
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          test "$code" = "200"

      - name: Dump Swoole stack state on failure
        if: failure()
        working-directory: /tmp/ci-fixture-swoole
        run: |
          docker compose -f ship/docker-compose.generated.yml --project-directory . ps
          docker compose -f ship/docker-compose.generated.yml --project-directory . logs

      - name: Tear down Swoole stack
        if: always()
        working-directory: /tmp/ci-fixture-swoole
        run: docker compose -f ship/docker-compose.generated.yml --project-directory . down -v --rmi local

      # A fourth fixture (dev mode only -- see Ship\Sync\MutagenSync's own docblock for why
      # production never needs this) for the opt-in SHIP_MUTAGEN sync mode: the one thing about it
      # that can't be verified by a unit test alone is that a real Mutagen sync session actually
      # moves files in both directions, and that `ship down` actually tears it down again.
      - name: Install Mutagen
        run: |
          MUTAGEN_VERSION=v0.18.1
          curl -sL -o /tmp/mutagen.tar.gz "https://github.com/mutagen-io/mutagen/releases/download/${MUTAGEN_VERSION}/mutagen_linux_amd64_${MUTAGEN_VERSION}.tar.gz"
          mkdir -p "$HOME/.local/mutagen"
          # Both files end up in the same directory deliberately -- Mutagen looks for
          # mutagen-agents.tar.gz alongside wherever its own binary lives, verified directly
          # (undocumented in --help) rather than assumed, since ship's own maintainer hit exactly
          # this "unable to locate agent bundle" failure from an install that only had the binary.
          tar -xzf /tmp/mutagen.tar.gz -C "$HOME/.local/mutagen"
          echo "$HOME/.local/mutagen" >> "$GITHUB_PATH"

      - name: Create a fixture Laravel app for Mutagen sync
        run: composer create-project laravel/laravel /tmp/ci-fixture-mutagen --prefer-dist --no-interaction

      - name: ship init (MySQL + Redis, default runtime)
        working-directory: /tmp/ci-fixture-mutagen
        run: |
          printf 'MySQL\nRedis\nNone\nNone\nNone\nNone\nNone\nNone\nNone\n8.4\n' \
            | php "$GITHUB_WORKSPACE/bin/ship" init

      - name: Point .env at the ship-provisioned services (Mutagen fixture)
        working-directory: /tmp/ci-fixture-mutagen
        run: |
          php -r '
          $path = ".env";
          $content = file_get_contents($path);
          $replacements = [
              "DB_CONNECTION" => "mysql",
              "DB_HOST" => "mysql",
              "DB_PORT" => "3306",
              "DB_DATABASE" => "ship",
              "DB_USERNAME" => "ship",
              "DB_PASSWORD" => "ship",
              "CACHE_STORE" => "redis",
              "REDIS_HOST" => "redis",
          ];
          foreach ($replacements as $key => $value) {
              $pattern = "/^{$key}=.*$/m";
              $content = preg_match($pattern, $content)
                  ? preg_replace($pattern, "{$key}={$value}", $content)
                  : $content . "\n{$key}={$value}\n";
          }
          file_put_contents($path, $content);
          '

      - name: ship up with SHIP_MUTAGEN=1 builds, boots, and syncs for real
        working-directory: /tmp/ci-fixture-mutagen
        env:
          SHIP_MUTAGEN: '1'
        run: |
          php "$GITHUB_WORKSPACE/bin/ship" up
          php "$GITHUB_WORKSPACE/bin/ship" exec app php artisan migrate --force
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          test "$code" = "200"

      # The one thing only a real round-trip proves: a file created on the host actually lands
      # inside the container, and vice versa -- not just that `ship up` and `mutagen sync create`
      # both exited 0.
      - name: Mutagen actually syncs files in both directions
        working-directory: /tmp/ci-fixture-mutagen
        run: |
          echo "from host" > mutagen-ci-check-host.txt
          for i in $(seq 1 10); do
            php "$GITHUB_WORKSPACE/bin/ship" exec app cat mutagen-ci-check-host.txt 2>/dev/null | grep -q "from host" && break
            sleep 1
          done
          php "$GITHUB_WORKSPACE/bin/ship" exec app cat mutagen-ci-check-host.txt | grep -q "from host"

          php "$GITHUB_WORKSPACE/bin/ship" exec app sh -c "echo 'from container' > mutagen-ci-check-container.txt"
          for i in $(seq 1 10); do
            [ -f mutagen-ci-check-container.txt ] && grep -q "from container" mutagen-ci-check-container.txt && break
            sleep 1
          done
          grep -q "from container" mutagen-ci-check-container.txt

      - name: Dump Mutagen stack state on failure
        if: failure()
        working-directory: /tmp/ci-fixture-mutagen
        run: |
          docker compose -f ship/docker-compose.generated.yml --project-directory . ps
          docker compose -f ship/docker-compose.generated.yml --project-directory . logs
          mutagen sync list

      - name: ship down tears down the Mutagen sync session too
        working-directory: /tmp/ci-fixture-mutagen
        env:
          SHIP_MUTAGEN: '1'
        run: |
          php "$GITHUB_WORKSPACE/bin/ship" down --volumes
          sessions=$(mutagen sync list --template='{{len .}}')
          test "$sessions" = "0"
